<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Valen Dynamics</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

  <!-- Navegación superior -->
  <header class="navbar">
    <div class="logo">
      <a href="../index.html">VALEN DYNAMICS</a>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="historia.html">Historia</a></li>
        <li><a href="modelos.html">Aeronaves</a></li>
        <li><a href="tecnologia.html">Tecnología</a></li>
        <li><a href="contacto.html" class="active">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Header de Subpágina con Imagen de Fondo (header-contacto) -->
  <section class="page-header header-contacto">
    <div class="container" style="padding: 0;">
      <h1>CONTACTO INSTITUCIONAL</h1>
      <p>Canal directo con nuestras divisiones de ingeniería, defensa e innovación aeroespacial.</p>
    </div>
  </section>

  <!-- Formulario de Contacto -->
  <main class="container" style="max-width: 650px;">
    <form style="background: var(--bg-card); padding: 2.5rem; border-radius: 4px; border: 1px solid var(--border-color);">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Ej. Ing. Juan Pérez">
      </div>
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="correo@organizacion.com">
      </div>
      <div class="form-group">
        <label for="asunto">Asunto</label>
        <input type="text" id="asunto" placeholder="Consulta técnica / Propuesta de desarrollo">
      </div>
      <div class="form-group">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" rows="5" placeholder="Describa los requerimientos de su proyecto o consulta..."></textarea>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; margin-top: 0.5rem;">Enviar Mensaje</button>
    </form>
  </main>

  <!-- Pie de página -->
  <footer>
    <p>&copy; 2026 Valen Dynamics. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
